name: AudioTrim
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.audiotrim
    APP_STORE_ID: "6836672410"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  AudioTrim:
    type: application
    platform: iOS
    sources:
      - path: AudioTrim
        excludes: [Info.plist]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        INFOPLIST_FILE: AudioTrim/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: AudioTrim AppStore
  AudioTrimTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AudioTrimTests
        excludes: [Fixtures]
      - path: AudioTrimTests/Fixtures
        buildPhase: resources
      - Shared
      - AudioTrim/MediaIO.swift
      - AudioTrim/MediaLibrary.swift
      - AudioTrim/MediaFixture.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  AudioTrimUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AudioTrimUITests]
    dependencies:
      - target: AudioTrim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AudioTrim
schemes:
  AudioTrim:
    build:
      targets:
        AudioTrim: all
        AudioTrimTests: [test]
    test:
      config: Debug
      targets: [AudioTrimTests]
  AudioTrimUI:
    build:
      targets:
        AudioTrim: all
        AudioTrimUITests: [test]
    test:
      config: Debug
      targets: [AudioTrimUITests]
